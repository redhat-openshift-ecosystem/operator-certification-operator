name: Build Release

on:
  release:
    types:
      - published
  push:
    branches:
      - ghactions

permissions:
  contents: read

env:
  PREFLIGHT_VERSION: "latest"

jobs:
  build-release:
    name: Build and push a tag image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache: false
        go-version-file: go.mod
      id: go
    - name: Set Env Tags
      run: |
        {
          echo "RELEASE_TAG=$(echo "${GITHUB_REF}" | cut -d '/' -f 3)"
          echo "IMAGE_REGISTRY=$(echo "${_IMAGE_REGISTRY}" | cut -d '/' -f 1)"
          echo "IMAGE_REPO=$(echo "${_IMAGE_REGISTRY}" | cut -d '/' -f 2)"
        } >> "${GITHUB_ENV}"
      env:
        _IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}

    - name: Build Operator Image
      id: build-operator-image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        image: operator-certification-operator
        tags: ${{ env.RELEASE_TAG }}
        build-args: |
          release_tag=${{ env.RELEASE_TAG }}
        dockerfiles: |
          ./Dockerfile

    - name: Push Operator Image
      id: push-operator-image
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
      with:
        image: operator-certification-operator
        tags: ${{ steps.build-operator-image.outputs.tags }}
        registry: ${{ secrets.IMAGE_REGISTRY }}
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    
    - name: Install Preflight CLI
      uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
      with:
        source: github
        preflight: "${{ env.PREFLIGHT_VERSION }}"

    - name: Run Preflight container certification check
      id: preflight-check
      run: |
        SUBMIT_FLAGS=""
        if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
          SUBMIT_FLAGS="--submit --pyxis-api-token=${PFLT_PYXIS_API_TOKEN} --certification-component-id=${PFLT_CERTIFICATION_COMPONENT_ID}"
        fi

        echo "::group::Preflight check container results"
        preflight check container \
          "${OPERATOR_IMAGE}" \
          ${SUBMIT_FLAGS} \
          --loglevel=debug 2>&1 | tee /tmp/preflight-output.txt
        PREFLIGHT_EXIT=${PIPESTATUS[0]}
        echo "::endgroup::"

        if [ "${PREFLIGHT_EXIT}" -ne 0 ]; then
          echo "::error::Preflight check container failed (exit code ${PREFLIGHT_EXIT}). See results above."
          echo "--- Preflight Results ---"
          cat /tmp/preflight-output.txt
          exit "${PREFLIGHT_EXIT}"
        fi
      env:
        OPERATOR_IMAGE: ${{ steps.push-operator-image.outputs.registry-path }}
        PFLT_PYXIS_API_TOKEN: ${{ secrets.PFLT_PYXIS_API_TOKEN }}
        PFLT_CERTIFICATION_COMPONENT_ID: ${{ secrets.PFLT_CERTIFICATION_COMPONENT_ID }}

    - name: Build Bundle
      id: build-bundle
      run: |
        VERSION="${RELEASE_TAG}" \
        USE_IMAGE_DIGESTS="true" \
        make bundle

    # This is a very naive implementation. Mainly for PoC
    - name: Add OpenShift metadata to bundle
      id: add-openshift-metadata
      run: |
        echo '  com.redhat.openshift.versions: "v4.8"' >> bundle/annotations.yaml
        echo 'LABEL com.redhat.openshift.versions="v4.8"' >> bundle.Dockerfile

    - name: Build Bundle Image
      id: build-bundle-image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        image: operator-certification-operator-bundle
        tags: ${{ env.RELEASE_TAG }}
        dockerfiles: |
          ./bundle.Dockerfile

    - name: Push Bundle Image
      id: push-bundle-image
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
      with:
        image: operator-certification-operator-bundle
        tags: ${{ steps.build-bundle-image.outputs.tags }}
        registry: ${{ env.IMAGE_REGISTRY }}/${{  env.IMAGE_REPO }}
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - run: |
        echo "Operator Image pushed to ${OPERATOR_IMAGE_REGISTRY_PATHS}"
        echo "Bundle Image pushed to ${BUNDLE_IMAGE_REGISTRY_PATHS}"
      env:
        OPERATOR_IMAGE_REGISTRY_PATHS: ${{ steps.push-operator-image.outputs.registry-paths }}
        BUNDLE_IMAGE_REGISTRY_PATHS: ${{ steps.push-bundle-image.outputs.registry-paths }}

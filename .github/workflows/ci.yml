name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sanity:
    name: sanity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache: false
        go-version-file: go.mod
      id: go

    - run: sudo rm -f /usr/local/bin/kustomize

    - name: Generate
      run: make generate

    - name: Manifests
      run: make manifests

    - name: Tidy
      run: make tidy

    - name: Vet
      run: make vet

    - name: Format
      run: make fmt

    - name: Run golangci linting checks
      run: make lint

    - name: Test
      run: make test
